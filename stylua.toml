# StyLua (MASTERPLAN §8.9 L0), matching the existing code: tabs, double quotes,
# 120 columns. Check: stylua --check src tests   Format: stylua src tests
syntax = "Luau"
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
