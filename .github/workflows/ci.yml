# L0 static + L1 unit checks on every push and pull request (MASTERPLAN §8.9).
# L3 engine tests (Open Cloud) run locally via tools/cloud_test.py until the
# ROBLOX_API_KEY / TEST_UNIVERSE_ID / TEST_PLACE_ID secrets are added.
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust tool binaries
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/rojo
            ~/.cargo/bin/lune
            ~/.cargo/bin/selene
            ~/.cargo/bin/stylua
          key: tools-rojo-7.7.1-lune-0.11.1-selene-0.31.0-stylua-2.6.0-luau

      - name: Install Rojo, Lune, Selene and StyLua
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          command -v rojo || cargo install rojo --version 7.7.1 --locked
          command -v lune || cargo install lune --version 0.11.1 --locked
          command -v selene || cargo install selene --version 0.31.0 --locked
          # StyLua needs the luau feature to parse type annotations
          command -v stylua || cargo install stylua --version 2.6.0 --locked --features luau

      - name: Fetch LihFolk checker
        run: git clone --depth 1 https://github.com/lihfolk-cy/v2-vault "$RUNNER_TEMP/v2-vault"

      - name: Compile every Luau file
        run: lune run tests/compile_check.luau

      - name: StyLua format check
        run: stylua --check src tests

      - name: Selene (main config, std roblox)
        # The first run generates the Roblox std from the API dump into ~/.cache/selene
        run: selene src tests

      - name: Selene (pure layers, restricted std) and purity grep
        run: |
          selene --config src/shared/Sim/selene.toml src/shared/Sim src/shared/Rec
          lune run tests/pure_check.luau

      - name: LihFolk Roblox checks
        run: sh "$RUNNER_TEMP/v2-vault/hooks/scripts/lihfolk-check.sh" --scan src tests

      - name: Build places
        run: |
          mkdir -p build
          rojo build -o build/EchoHeist.rbxlx
          rojo build bench.project.json -o build/CloneBench.rbxlx
          rojo build spikes/capture.project.json -o build/CaptureSpike.rbxlx
          rojo build spikes/stems.project.json -o build/StemsSpike.rbxlx

      - name: Place structure check
        run: |
          for place in EchoHeist CloneBench CaptureSpike StemsSpike; do
            lune run tests/place_check.luau "build/$place.rbxlx"
          done

      - name: Kit check (spike S2; skips until ServerStorage/Kit is mapped)
        run: lune run tests/kit_check.luau build/EchoHeist.rbxlx

      - name: Unit tests
        run: |
          if [ -f tests/run_unit.luau ]; then lune run tests/run_unit.luau; else echo "no unit tests yet"; fi

      - name: Upload built place
        uses: actions/upload-artifact@v4
        with:
          name: places
          path: build/*.rbxlx
